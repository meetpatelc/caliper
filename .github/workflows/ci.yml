name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run brand-check

  # Kept separate from Check on purpose: a browser test that goes flaky must not
  # be able to block a formula fix. Playwright was already installed by every
  # `npm ci` here and never once executed, which is how a dialog nobody could
  # click shipped, and stayed shipped.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --port 8080 --strictPort &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "preview never answered"; exit 1
      - run: npm run qa:ui
      - run: npm run qa:live

      # The auth invariant compares what the dev server resolves for
      # VITE_AUTH_ENABLED against what the next build resolves. It can only be
      # observed against a dev server — `/__app-env` is dev-only middleware —
      # so running it against the preview above returns "could not observe" and
      # exits 2. That is the honest answer, and it is why this gate had never
      # actually run anywhere: it was written for a server nothing started.
      - name: Check the auth invariant against a dev server
        run: |
          npx vite preview --port 8080 --strictPort >/dev/null 2>&1 &
          kill %1 2>/dev/null || true
          npm run dev >/tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/__app-env; then break; fi
            sleep 2
          done
          npm run check:auth
