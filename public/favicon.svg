<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Ink ground, light mark. The ground used to be #e8eaed, which is within a
    shade of Chrome's light tab strip, so the icon rendered and could not be
    seen. Inverting it reads on a light strip and on a dark one, and matches
    public/favicon.ico, which scripts/make-favicon.mjs draws from this geometry.
  -->
  <rect width="100" height="100" rx="8" fill="#1b1e24"/>
  <path d="M68 28 A 30 30 0 1 0 68 72" fill="none" stroke="#e8eaed" stroke-width="9" stroke-linecap="square"/>
  <path d="M68 28 H88" fill="none" stroke="#c8102e" stroke-width="9" stroke-linecap="square"/>
  <path d="M68 72 H88" fill="none" stroke="#e8eaed" stroke-width="9" stroke-linecap="square"/>
</svg>
